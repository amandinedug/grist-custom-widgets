<!DOCTYPE html>
<!-- ■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■
■ NOM DU WIDGET   : Dropdown DSFR
■ VERSION         : 1.1.0
■ DESCRIPTION     : Menu déroulant conforme DSFR permettant de sélectionner
■                   une valeur parmi les enregistrements d'une table Grist.
■                   La sélection pilote le curseur Grist (et donc les widgets
■                   liés) et peut être synchronisée entre plusieurs pages
■                   via un identifiant de session.
■ FONCTIONNALITÉS : - Menu déroulant avec design DSFR (Marianne, couleurs officielles)
■                   - Synchronisation entre pages via sessionStorage
■ USAGE RESTREINT : Réservé aux services de l'État français (circulaire n°6411-SG)
■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■■ -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Drop-down Widget</title>
  <link href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/dsfr/dsfr.min.css" rel="stylesheet">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    @font-face { font-family: 'Marianne'; src: url('https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/fonts/Marianne-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Marianne'; src: url('https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/fonts/Marianne-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

    * { box-sizing: border-box; }

    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: var(--grist-theme-page-bg, #f6f6f6); font-family: 'Marianne', Arial, sans-serif; }

    #container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: stretch; }

    #dropdown {
      --data-uri-svg: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iIzE2MTYxNiIgZD0ibTEyIDEzLjEgNS00LjkgMS40IDEuNC02LjQgNi4zLTYuNC02LjRMNyA4LjFsNSA1eiIvPjwvc3ZnPg==');
      background-color: var(--background-contrast-grey);
      background-image: var(--data-uri-svg);
      background-position: calc(100% - 1rem) 50%;
      background-repeat: no-repeat;
      background-size: 1rem 1rem;
      -webkit-appearance: none; -moz-appearance: none; appearance: none;
      color: var(--text-default-grey);
      padding: .5rem 2.5rem .5rem 1rem;
      display: block; width: 100%; height: 100%;
      font-size: 1rem; box-sizing: border-box; margin: 0; cursor: pointer;
    }
    #dropdown:disabled {
      --data-uri-svg: url(data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23929292' d='m12 13.1 5-4.9 1.4 1.4-6.4 6.3-6.4-6.4L7 8.1l5 5z'/%3E%3C/svg%3E);
      background-image: var(--data-uri-svg);
      box-shadow: inset 0 -2px 0 0 var(--border-disabled-grey);
      color: var(--text-disabled-grey);
    }

    #error-banner { display: none; position: absolute; top: 0; left: 0; right: 0; background-color: #ffe9e9; color: #ce0500; font-size: 0.75rem; padding: 0.25rem 0.75rem; border-bottom: 2px solid #ce0500; z-index: 10; }
    #loader { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; align-items: center; justify-content: center; background-color: var(--grist-theme-page-bg, #f6f6f6); font-size: 0.875rem; color: #666; z-index: 5; }

    #config { padding: 1rem; }
    #config-hint { display: block; margin-bottom: 0.5rem; font-size: 14px; font-weight: 700; color: #161616; line-height: 1.4; }
    #config-row { display: flex; gap: 0.5rem; align-items: center; }
    #config input { flex: 1; min-width: 0; padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 0.25rem; font-family: 'Marianne', Arial, sans-serif; font-size: 14px; }
    #config input:focus { outline: 2px solid #0a76f6; outline-offset: 2px; border-color: #0a76f6; }
    #config button { padding: 0.5rem 1rem; background-color: #000091; color: white; border: none; border-radius: 0.25rem; font-family: 'Marianne', Arial, sans-serif; font-size: 14px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: background-color 0.2s; }
    #config button:hover { background-color: #1212ff; }
    #config button:active { background-color: #2323ff; }
  </style>
</head>
<body>
  <div id="error-banner" role="alert"></div>
  <div id="loader">Chargement…</div>
  <div id="container">
    <select id="dropdown"></select>
  </div>
  <div id="config" style="display: none;">
    <span id="config-hint">Entrez un identifiant unique pour synchroniser ce dropdown avec ceux des autres pages du document.</span>
    <div id="config-row">
      <input type="text" id="sessionid" autocomplete="off" placeholder="ex : selection_programme">
      <button id="save-btn">Appliquer</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
